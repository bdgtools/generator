<!DOCTYPE html>
<html>
<head>

<title>Stock Opname Generator</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

button {
  padding: 10px 20px;
  margin-top: 15px;
  cursor: pointer;
}

#hasil {
  margin-top: 20px;
  text-align: left;
}
</style>

</head>

<body>

<div class="container">

<h1>Stock Opname Generator</h1>

<p>Pilih file TXT hasil stock opname</p>

<input type="file" id="file">

<br>

<button onclick="bacaFile()">
Baca File
</button>


<div id="hasil">
</div>


</div>
<script>

function bacaFile(){

let file = document.getElementById("file").files[0];


if(!file){
alert("Pilih file terlebih dahulu");
return;
}


let reader = new FileReader();


reader.onload = function(e){

let isi = e.target.result;


// Pisahkan per baris
let baris = isi
.split(/\r?\n/)
.filter(x => x.trim() !== "");


// Ambil SKU kolom pertama
let sku = baris.map(function(data){

    let kolom = data.split(",");

    return kolom[0].trim();

});


// Hitung SKU unik
let skuUnik = [...new Set(sku)];


// Hitung duplicate
let duplicate = sku.length - skuUnik.length;



document.getElementById("hasil").innerHTML =

`
<h3>Hasil Stock Opname</h3>

Nama File :
${file.name}

<br><br>

Total Data :
${baris.length}

<br>

Total SKU Unik :
${skuUnik.length}

<br>

Duplicate SKU :
${duplicate}

`;

};


reader.readAsText(file);

}

</script>

</body>
</html>
