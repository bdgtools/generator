<!DOCTYPE html>
<html>
<head>

<title>Stock Opname Generator</title>

<style>

body{
  font-family: Arial, sans-serif;
  padding:30px;
  background:#f5f5f5;
}


.container{
  background:white;
  max-width:900px;
  margin:auto;
  padding:25px;
  border-radius:10px;
}


h1{
  text-align:center;
}


.box{
  margin-top:20px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px;
}


button{
  padding:10px 20px;
  margin-top:15px;
  cursor:pointer;
}


table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}


th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}


th{
  background:#eee;
}


</style>

</head>


<body>


<div class="container">


<h1>Stock Opname Generator</h1>


<div class="box">

<h3>1. Upload Scan Fisik</h3>

<input type="file" id="fisikFile">

</div>



<div class="box">

<h3>2. Upload TXT Sistem</h3>

<input type="file" id="sistemFile">

</div>



<button onclick="generateData()">
GENERATE
</button>



<div id="hasil"></div>


</div>



<script>


let dataFisik = {};
let dataSistem = {};



// membaca file fisik

function bacaFisik(file){

return new Promise((resolve)=>{


let reader = new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let rack=col[0].trim();
let sku=col[1].trim();
let qty=Number(col[2]);


if(!hasil[sku]){

hasil[sku]={
rack:rack,
qty:0
};

}


hasil[sku].qty += qty;


});


resolve(hasil);


};


reader.readAsText(file);


});


}




// membaca file sistem

function bacaSistem(file){

return new Promise((resolve)=>{


let reader=new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let sku=col[0].trim();


hasil[sku]={

system:col[3],
desc:col[8]

};


});


resolve(hasil);


};


reader.readAsText(file);


});

}





async function generateData(){


let fisik=document.getElementById("fisikFile").files[0];

let sistem=document.getElementById("sistemFile").files[0];


if(!fisik || !sistem){

alert("Upload kedua file terlebih dahulu");

return;

}



dataFisik=await bacaFisik(fisik);

dataSistem=await bacaSistem(sistem);



tampilkan();



}




function tampilkan(){


let html=`

<table>

<tr>

<th>SKU</th>
<th>Rack Number</th>
<th>Fisik</th>
<th>Sistem</th>
<th>Deskripsi</th>

</tr>

`;



Object.keys(dataFisik).forEach(sku=>{


let fisik=dataFisik[sku];

let sistem=dataSistem[sku] || {};



html+=`

<tr>

<td>${sku}</td>

<td>${fisik.rack}</td>

<td>${fisik.qty}</td>

<td>${sistem.system || 0}</td>

<td>${sistem.desc || "-"}</td>

</tr>

`;


});



html+=`</table>`;


document.getElementById("hasil").innerHTML=html;


}


</script>


</body>
</html>
