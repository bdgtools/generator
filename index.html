<!DOCTYPE html>
<html>
<head>

<div class="header">

<img src="logo mrdiy.png" class="logo">

<h1>
Stock Balance Check Generator
</h1>

</div>

<style>
  
body{
  font-family:'Arial', sans-serif;
  padding:30px;
  background:#111;
}


.container{
  background:white;
  max-width:950px;
  margin:auto;
  padding:30px;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
}


h1{
  text-align:center;
  color:#111;
  font-size:28px;
}


.header{
  background:#FFD400;
  padding:20px;
  border-radius:15px 15px 0 0;
  text-align:center;
}


.logo{
  width:180px;
  height:auto;
  display:block;
  margin:auto;
}

.box{
  margin-top:20px;
  padding:20px;
  border-radius:12px;
  border:2px solid #FFD400;
  background:#fff;
}


label{
  font-weight:bold;
  color:#111;
}


input, select{
  border:1px solid #ccc;
  border-radius:8px;
}


button{

  background:#111;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;

}


button:hover{

  background:#FFD400;
  color:#111;

}


.summary{
  display:flex;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}


.card{

  flex:1;
  min-width:160px;
  padding:20px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.15);

}


.total{
 background:#111;
 color:white;
}


.tally{
 background:#FFD400;
 color:#111;
}


.extra{
 background:#fff3cd;
 color:#8a6500;
}


.short{
 background:#dc3545;
 color:white;
}


table{

 width:100%;
 border-collapse:collapse;
 margin-top:20px;

}


th{

 background:#111;
 color:white;
 padding:10px;

}


td{

 padding:8px;
 border:1px solid #ddd;

}


.plus{

 background:#fff3cd;
 color:#856404;
 font-weight:bold;

}


.minus{

 background:#dc3545;
 color:white;
 font-weight:bold;

}


.sama{

 background:#d4edda;
 color:#155724;
 font-weight:bold;

}


#hasilContainer{
  margin-top:20px;
  max-height:500px;
  overflow-y:auto;
  border:1px solid #ddd;
}


#hasilContainer thead{
  position:sticky;
  top:0;
  z-index:10;
}

#hasilContainer th{
  background:white;
}

#hasilContainer thead{
  position:sticky;
  top:0;
}

</style>

</head>

<body>
<div id="loginPage" class="container">

  <h1>Stock Balance Check Generator</h1>

  <div class="box">

    <h3>Login</h3>

    <label>Store Code</label><br>
    <input 
      type="text" 
      id="storeCode"
      placeholder="Contoh: JW2001"
      style="width:100%;padding:10px;margin-bottom:10px;">

    <label>Password</label><br>
    <input 
      type="password"
      id="password"
      placeholder="Password"
      style="width:100%;padding:10px;">

    <button onclick="login()" style="margin-top:20px;">
      LOGIN
    </button>

    <p id="loginMsg" style="color:red;"></p>

  </div>

</div>


<!-- MAIN PAGE -->

<div id="mainPage" class="container" style="display:none;">
  
  <div id="storeInfo"
       style="text-align:center;
              font-weight:bold;
              color:#0066cc;
              margin-bottom:20px;">
  </div>

  <button onclick="logout()" style="float:right;margin-top:-45px;">
  Logout
</button>

<div style="clear:both;"></div>

  <div class="box">

    <h3>1. Upload Scan Fisik</h3>

    <input type="file" id="fisikFile" multiple>

  </div>


  <div class="box">

    <h3>2. Upload File Export Shelf</h3>

    <input type="file" id="sistemFile">

  </div>


  <button onclick="generateData()">
    GENERATE
  </button>


  <div id="summary"></div>


  <div style="margin-top:20px">

    <input 
      type="text"
      id="search"
      placeholder="Cari SKU atau Deskripsi..."
      onkeyup="filterTabel()"
      style="padding:10px;width:250px;">


    <select id="filter" onchange="filterTabel()" style="padding:10px">

      <option value="all">Semua</option>
      <option value="plus">extra (+)</option>
      <option value="minus">short (-)</option>
      <option value="sama">tally (0)</option>

    </select>

  </div>


  <div id="hasilContainer">

    <div id="hasil"></div>

  </div>


</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzPkU1IngIVVAkdqyb4803fjwWj-xFblnUo2xSypsF1QWvZWh6fK8X_XZUYmMBdT1Xz/exec";


let dataFisik = {};
let dataSistem = {};



// membaca file fisik

function bacaFisik(file){

return new Promise((resolve)=>{


let reader = new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let rack=col[0].trim();
let sku=col[1].trim();
let qty=Number(col[2]);


if(!hasil[sku]){

hasil[sku]={
rack:rack,
qty:0
};

}


hasil[sku].qty += qty;


});


resolve(hasil);


};


reader.readAsText(file);


});


}




// membaca file sistem

function bacaSistem(file){

return new Promise((resolve)=>{


let reader=new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let sku=col[0].trim();


hasil[sku]={

system:col[3],
desc:col[8]

};


});


resolve(hasil);


};


reader.readAsText(file);


});

}





async function generateData(){

let fisikFiles=document.getElementById("fisikFile").files;

let sistem=document.getElementById("sistemFile").files[0];


if(fisikFiles.length==0 || !sistem){

alert("Upload file fisik dan sistem terextra dahulu");

return;

}


// gabungkan semua file fisik

dataFisik={};


for(let i=0;i<fisikFiles.length;i++){

let hasil = await bacaFisik(fisikFiles[i]);


Object.keys(hasil).forEach(sku=>{


if(!dataFisik[sku]){

dataFisik[sku]=hasil[sku];

}
else{

dataFisik[sku].qty += hasil[sku].qty;

}


});


}



dataSistem=await bacaSistem(sistem);



tampilkan();



}




function tampilkan(){

let totalSKU = Object.keys(dataFisik).length;

let tally = 0;
let extra = 0;
let short = 0;

let html=`

<table>

<thead>

<tr>

<th>SKU</th>
<th>Rack Number</th>
<th>Fisik</th>
<th>Sistem</th>
<th>Selisih</th>
<th>Deskripsi</th>

</tr>

</thead>

<tbody>

`;
Object.keys(dataFisik)
.sort((a,b)=>{

return dataFisik[a].rack.localeCompare(
dataFisik[b].rack,
undefined,
{
numeric:true,
sensitivity:"base"
}
);

})
.forEach(sku=>{


let fisik=dataFisik[sku];

let sistem=dataSistem[sku] || {};

let qtySistem = Number(sistem.system) || 0;

let selisih = fisik.qty - qtySistem;



if(selisih == 0){
  tally++;
}
else if(selisih > 0){
  extra++;
}
else{
  short++;
}



let warna = "";

if(selisih > 0){
  warna="plus";
}
else if(selisih < 0){
  warna="minus";
}
else{
  warna="sama";
}



html+=`

<tr>

<td>${sku}</td>

<td>${fisik.rack}</td>

<td>${fisik.qty}</td>

<td>${qtySistem}</td>

<td class="${warna}">
${selisih}
</td>

<td>${sistem.desc || "-"}</td>

</tr>

`;


});

html+=`</table>`;

document.getElementById("summary").innerHTML =

`

<div class="summary">

<div class="card total">
Total SKU<br>
${totalSKU}
</div>


<div class="card tally">
tally (0)<br>
${tally}
</div>


<div class="card extra">
extra (+)<br>
${extra}
</div>


<div class="card short">
short (-)<br>
${short}
</div>


</div>

`;

document.getElementById("hasil").innerHTML=html;


}
function filterTabel(){

let keyword = document
.getElementById("search")
.value
.toLowerCase();


let filter = document
.getElementById("filter")
.value;


let rows = document
.querySelectorAll("#hasil table tr");


rows.forEach((row,index)=>{


if(index==0) return;


let text=row.innerText.toLowerCase();


let cocokCari=text.includes(keyword);


let cocokFilter=true;


if(filter!="all"){

let selisihCell=row.children[4];


cocokFilter=
selisihCell.classList.contains(filter);

}


if(cocokCari && cocokFilter){

row.style.display="";

}
else{

row.style.display="none";

}


});


}
async function login(){

  const store = document.getElementById("storeCode").value.trim().toUpperCase();
  const pass = document.getElementById("password").value.trim();

  if(store === "" || pass === ""){
    document.getElementById("loginMsg").innerHTML = "Store Code dan Password wajib diisi.";
    return;
  }

  document.getElementById("loginMsg").innerHTML = "Sedang login...";

  try{

    const response = await fetch(
      `${GAS_URL}?storeCode=${encodeURIComponent(store)}&password=${encodeURIComponent(pass)}`
    );

    const result = await response.json();

    if(result.success){

      sessionStorage.setItem("storeCode", result.storeCode);
      sessionStorage.setItem("storeName", result.storeName);

      document.getElementById("loginPage").style.display = "none";
      document.getElementById("mainPage").style.display = "block";

      document.getElementById("loginMsg").innerHTML = "";

      if(document.getElementById("storeInfo")){
        document.getElementById("storeInfo").innerHTML =
          `${result.storeCode} - ${result.storeName}`;
      }

    }else{

      document.getElementById("loginMsg").innerHTML =
        "Store Code / Password salah atau user tidak aktif.";

    }

  }catch(err){

    console.error(err);

    document.getElementById("loginMsg").innerHTML =
      "Tidak dapat terhubung ke server.";

  }
}

function logout(){

  sessionStorage.clear();

  document.getElementById("mainPage").style.display = "none";
  document.getElementById("loginPage").style.display = "block";

  document.getElementById("password").value = "";
  document.getElementById("loginMsg").innerHTML = "";
}

window.onload = function(){

  if(sessionStorage.getItem("storeCode")){

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";

    document.getElementById("storeInfo").innerHTML =
      sessionStorage.getItem("storeCode") +
      " - " +
      sessionStorage.getItem("storeName");

  }

}

</script>


</body>
</html>
