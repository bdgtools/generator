<!DOCTYPE html>
<html>
<head>

<title>Stock Balance Check Generator</title>

<style>

.summary{
  display:flex;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}


.card{
  flex:1;
  min-width:150px;
  padding:15px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}


.total{
  background:#eee;
}


.sesuai{
  background:#d4edda;
  color:green;
}


.lebih{
  background:#fff3cd;
  color:#b88600;
}


.kurang{
  background:#f8d7da;
  color:red;
}
.plus{
  color:#b88600;
  background:#fff3cd;
  font-weight:bold;
}

.minus{
  color:red;
  background:#f8d7da;
  font-weight:bold;
}

.sama{
  color:green;
  background:#d4edda;
  font-weight:bold;
}

body{
  font-family: Arial, sans-serif;
  padding:30px;
  background:#f5f5f5;
}


.container{
  background:white;
  max-width:900px;
  margin:auto;
  padding:25px;
  border-radius:10px;
}


h1{
  text-align:center;
}


.box{
  margin-top:20px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px;
}


button{
  padding:10px 20px;
  margin-top:15px;
  cursor:pointer;
}


table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}


th,td{
  border:1px solid #ccc;
  padding:4px 6px;
  text-align:center;
  font-size:12px;
}


th{
  font-size:12px;
  white-space:nowrap;
}
#hasilContainer{
  margin-top:20px;
  max-height:500px;
  overflow-y:auto;
  border:1px solid #ddd;
}


#hasilContainer table{
  margin-top:0;
}


#hasilContainer thead{
  position:sticky;
  top:0;
}

</style>

</head>


<body>


<div class="container">


<h1>Stock Balance Check Generator</h1>


<div class="box">

<h3>1. Upload Scan Fisik</h3>

<input type="file" id="fisikFile" multiple>

</div>



<div class="box">

<h3>2. Upload TXT Sistem</h3>

<input type="file" id="sistemFile">

</div>



<button onclick="generateData()">
GENERATE
</button>

<div id="summary"></div>


<div style="margin-top:20px">

<input 
type="text" 
id="search"
placeholder="Cari SKU atau Deskripsi..."
onkeyup="filterTabel()"
style="padding:10px;width:250px;"
>


<select id="filter" onchange="filterTabel()" style="padding:10px">

<option value="all">Semua</option>
<option value="plus">Lebih (+)</option>
<option value="minus">Kurang (-)</option>
<option value="sama">Sesuai (0)</option>

</select>

</div>


<div id="hasilContainer">

<div id="hasil"></div>

</div>


</div>



<script>


let dataFisik = {};
let dataSistem = {};



// membaca file fisik

function bacaFisik(file){

return new Promise((resolve)=>{


let reader = new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let rack=col[0].trim();
let sku=col[1].trim();
let qty=Number(col[2]);


if(!hasil[sku]){

hasil[sku]={
rack:rack,
qty:0
};

}


hasil[sku].qty += qty;


});


resolve(hasil);


};


reader.readAsText(file);


});


}




// membaca file sistem

function bacaSistem(file){

return new Promise((resolve)=>{


let reader=new FileReader();


reader.onload=function(e){


let rows=e.target.result
.split(/\r?\n/)
.filter(x=>x.trim()!="");


let hasil={};


rows.forEach(row=>{


let col=row.split(",");


let sku=col[0].trim();


hasil[sku]={

system:col[3],
desc:col[8]

};


});


resolve(hasil);


};


reader.readAsText(file);


});

}





async function generateData(){

let fisikFiles=document.getElementById("fisikFile").files;

let sistem=document.getElementById("sistemFile").files[0];


if(fisikFiles.length==0 || !sistem){

alert("Upload file fisik dan sistem terlebih dahulu");

return;

}


// gabungkan semua file fisik

dataFisik={};


for(let i=0;i<fisikFiles.length;i++){

let hasil = await bacaFisik(fisikFiles[i]);


Object.keys(hasil).forEach(sku=>{


if(!dataFisik[sku]){

dataFisik[sku]=hasil[sku];

}
else{

dataFisik[sku].qty += hasil[sku].qty;

}


});


}



dataSistem=await bacaSistem(sistem);



tampilkan();



}




function tampilkan(){

let totalSKU = Object.keys(dataFisik).length;

let sesuai = 0;
let lebih = 0;
let kurang = 0;

let html=`

<table>

<thead>

<tr>

<th>SKU</th>
<th>Rack Number</th>
<th>Fisik</th>
<th>Sistem</th>
<th>Selisih</th>
<th>Deskripsi</th>

</tr>

</thead>

<tbody>

</tr>

`;
Object.keys(dataFisik)
.sort((a,b)=>{

return dataFisik[a].rack.localeCompare(
dataFisik[b].rack,
undefined,
{
numeric:true,
sensitivity:"base"
}
);

})
.forEach(sku=>{


let fisik=dataFisik[sku];

let sistem=dataSistem[sku] || {};

let qtySistem = Number(sistem.system) || 0;

let selisih = fisik.qty - qtySistem;



if(selisih == 0){
  sesuai++;
}
else if(selisih > 0){
  lebih++;
}
else{
  kurang++;
}



let warna = "";

if(selisih > 0){
  warna="plus";
}
else if(selisih < 0){
  warna="minus";
}
else{
  warna="sama";
}



html+=`

<tr>

<td>${sku}</td>

<td>${fisik.rack}</td>

<td>${fisik.qty}</td>

<td>${qtySistem}</td>

<td class="${warna}">
${selisih}
</td>

<td>${sistem.desc || "-"}</td>

</tr>

`;


});

html+=`</table>`;

document.getElementById("summary").innerHTML =

`

<div class="summary">

<div class="card total">
Total SKU<br>
${totalSKU}
</div>


<div class="card sesuai">
Sesuai (0)<br>
${sesuai}
</div>


<div class="card lebih">
Lebih (+)<br>
${lebih}
</div>


<div class="card kurang">
Kurang (-)<br>
${kurang}
</div>


</div>

`;

document.getElementById("hasil").innerHTML=html;


}
function filterTabel(){

let keyword = document
.getElementById("search")
.value
.toLowerCase();


let filter = document
.getElementById("filter")
.value;


let rows = document
.querySelectorAll("#hasil table tr");


rows.forEach((row,index)=>{


if(index==0) return;


let text=row.innerText.toLowerCase();


let cocokCari=text.includes(keyword);


let cocokFilter=true;


if(filter!="all"){

let selisihCell=row.children[4];


cocokFilter=
selisihCell.classList.contains(filter);

}


if(cocokCari && cocokFilter){

row.style.display="";

}
else{

row.style.display="none";

}


});


}

</script>


</body>
</html>
