<!DOCTYPE html>
<html>
<head>
  <title>Stock Opname Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h1 {
      color: #333;
    }

    input {
      margin: 20px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 20px;
      text-align: left;
      background: #eee;
      padding: 15px;
      border-radius: 5px;
    }
  </style>

</head>

<body>

<div class="container">

<h1>Stock Opname Generator</h1>

<p>Upload file TXT hasil stock opname</p>

<input type="file" id="fileInput">


<br>

<button onclick="processFile()">
PROSES DATA
</button>


<div class="result" id="result">
Hasil akan muncul di sini...
</div>


</div>


<script>

function processFile(){

  const file = document.getElementById("fileInput").files[0];

  if(!file){
    alert("Silahkan pilih file terlebih dahulu");
    return;
  }


  const reader = new FileReader();


  reader.onload = function(e){

    let text = e.target.result;

    let rows = text.split("\n");


    document.getElementById("result").innerHTML =
    `
    Total Baris : ${rows.length}
    <br>
    File : ${file.name}
    `;

  };


  reader.readAsText(file);

}

</script>


</body>
</html>
